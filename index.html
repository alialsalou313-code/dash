<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We've Moved! | DashLB</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f8fafc;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    /* Animated Background */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      
      /* Fade-in Animation */
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Typography & Elements */
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    p.message {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    /* Action Button */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Countdown & Footer */
    .countdown {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.25rem;
    }

    footer span {
      color: #ef4444;
    }

    /* Responsive Adjustments */
    @media (max-width: 480px) {
      .glass-card {
        padding: 2.25rem 1.5rem;
      }
      h1 {
        font-size: 1.65rem;
      }
      p.message {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <div class="icon">🚀</div>
    <h1>We've Moved!</h1>
    <p class="message">
      We now have a new official website and domain.<br>
      Please update your bookmarks and continue using our new website.
    </p>
    
    <a href="https://www.dashlb.shop" class="btn">Visit DashLB.shop</a>
    
    <div class="countdown" id="timer">Redirecting in 8...</div>

    <footer>
      Thank you for supporting DashLB <span>❤️</span>
    </footer>
  </div>

  <script>
    (function () {
      const targetUrl = "https://www.dashlb.shop";
      let secondsLeft = 8;
      const timerElement = document.getElementById("timer");

      const interval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          timerElement.textContent = `Redirecting in ${secondsLeft}...`;
        } else {
          timerElement.textContent = "Redirecting now...";
          clearInterval(interval);
          window.location.href = targetUrl;
        }
      }, 1000);
    })();
  </script>

</body>
</html>
