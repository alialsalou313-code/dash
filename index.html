ScreenRenderers.adminUsers = function(app){
  app.innerHTML = '<div class="empty-state">جارٍ التحميل...</div>';
  rpc("mm_admin_users", {p_session_token:Auth.token}).then(function(res){
    if(!res || !res.ok){ app.innerHTML = '<div class="empty-state">'+escapeHtml((res&&res.message)||"تعذر التحميل")+'</div>'; return; }
    drawList(res.users||[]);
  }).catch(function(){ app.innerHTML = '<div class="empty-state">تعذر الاتصال بالخادم</div>'; });

  function countryOptionsHtml(id, selected){
    var c=normalizeCountry(selected);
    return '<select id="'+id+'"><option value="LB" '+(c==="LB"?"selected":"")+'>لبنان 🇱🇧</option><option value="SY" '+(c==="SY"?"selected":"")+'>سوريا 🇸🇾</option></select>';
  }
  function currencyOptionsFor(country){
    return normalizeCountry(country)==="SY" ? [{c:"USD",n:"دولار أمريكي"},{c:"SYP",n:"ليرة سورية"},{c:"TRY",n:"ليرة تركية"}] : [{c:"USD",n:"دولار أمريكي"},{c:"LBP",n:"ليرة لبنانية"}];
  }
  function refreshCurrencySelect(countrySelId, currencySelId, selected){
    var country = document.getElementById(countrySelId).value;
    var opts = currencyOptionsFor(country);
    var keep=String(selected||"").toUpperCase();
    if(!opts.some(function(o){return o.c===keep;})) keep=opts[0].c;
    document.getElementById(currencySelId).innerHTML = opts.map(function(o){ return '<option value="'+o.c+'" '+(o.c===keep?"selected":"")+'>'+o.n+' ('+o.c+')</option>'; }).join("");
  }

  function drawList(users){
    var html = '<button class="btn btn-primary" id="create-user-btn" style="margin-bottom:12px;">➕ إنشاء مستخدم</button>';
    if(users.length===0){
      html += '<div class="empty-state"><div class="ic">👥</div>لا يوجد مستخدمون بعد</div>';
    }else{
      html += users.map(function(u){
        var statusBadge = !u.active ? '<span class="badge danger">معطّل</span>' : (u.expired? '<span class="badge danger">منتهي</span>' : '<span class="badge ok">نشط</span>');
        return '<div class="list-item" data-uid="'+u.id+'" style="align-items:flex-start;cursor:pointer;">'+
          '<div class="avatar-circle">'+(u.username?escapeHtml(u.username.charAt(0).toUpperCase()):"?")+'</div>'+
          '<div class="li-main">'+
            '<div class="li-title">'+escapeHtml(u.fullName||u.username)+' '+statusBadge+'</div>'+
            '<div class="li-sub">'+escapeHtml(u.username)+' · '+escapeHtml(countryLabel(u.country))+' / '+escapeHtml(u.currency||"-")+'</div>'+
            '<div class="li-sub">ينتهي: '+(u.expiresAt? fmtDate(u.expiresAt): "-")+'</div>'+
            '<div class="small-muted">منتجات: '+(u.productsCount||0)+' · مبيعات: '+(u.salesCount||0)+' · أرباح: '+round2(u.profitBase||0)+'</div>'+
          '</div>'+
          '<div style="display:flex;flex-direction:column;gap:6px;min-width:82px;">'+
            '<button class="btn btn-outline btn-sm edit-user-btn">تعديل</button>'+
            '<button class="btn btn-ghost btn-sm renew-btn">تجديد</button>'+
            '<button class="btn btn-danger btn-sm delete-user-btn">حذف نهائي</button>'+
          '</div>'+
        '</div>';
      }).join("");
    }
    app.innerHTML = html;
    var createBtn=document.getElementById("create-user-btn");
    if(createBtn) createBtn.addEventListener("click", openCreateModal);
    app.querySelectorAll("[data-uid]").forEach(function(row){
      row.addEventListener("click", function(e){
        if(e.target.closest("button")) return;
        openUserDetails(row.getAttribute("data-uid"));
      });
    });
    app.querySelectorAll(".edit-user-btn").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var uid = b.closest("[data-uid]").getAttribute("data-uid");
        openEditModal(users.find(function(u){ return u.id===uid; }));
      });
    });
    app.querySelectorAll(".renew-btn").forEach(function(b){
      b.addEventListener("click", function(e){ e.stopPropagation(); openRenewModal(b.closest("[data-uid]").getAttribute("data-uid")); });
    });
    app.querySelectorAll(".delete-user-btn").forEach(function(b){
      b.addEventListener("click", function(e){ e.stopPropagation(); openDeleteModal(b.closest("[data-uid]").getAttribute("data-uid")); });
    });
  }

  function countryLabel(country){ return normalizeCountry(country)==="SY" ? "سوريا" : "لبنان"; }
  function dateInputValue(d){
    var x=new Date(d); if(isNaN(x.getTime())) x=new Date();
    x.setMinutes(x.getMinutes()-x.getTimezoneOffset());
    return x.toISOString().slice(0,16);
  }
  function moneyFor(baseAmount, state){
    var base=(state.settings&&state.settings.baseCurrency)||"USD";
    return fmtMoney(baseAmount,base);
  }
  function sumSales(sales){
    return sales.reduce(function(a,s){a.sales+=num(s.totalInBase);a.profit+=num(s.profitInBase);return a;},{sales:0,profit:0});
  }
  function inRange(iso, from, to){
    var d=new Date(iso); if(isNaN(d.getTime())) return false;
    if(from){ var f=new Date(from+"T00:00:00"); if(d<f) return false; }
    if(to){ var t=new Date(to+"T23:59:59.999"); if(d>t) return false; }
    return true;
  }
  function renderDetail(data, userId){
    var u=data.user||{};
    var st=data.state||{};
    st.settings=Object.assign({},DB.data.settings,st.settings||{});
    var products=st.products||[], sales=st.sales||[], purchases=st.purchases||[], debts=st.debts||[];
    var base=st.settings.baseCurrency||"USD";
    var totals=sumSales(sales);
    var stockValue=products.reduce(function(a,p){return a+toBase(num(p.buyPrice)*num(p.qty),p.currency);},0);
    var debtValue=debts.reduce(function(a,d){return d.status!=="paid"?a+toBase(num(d.remaining),d.currency):a;},0);
    var html='<div class="admin-detail-head">'+
      '<div><div class="li-title" style="font-size:18px;">'+escapeHtml(u.fullName||u.username||"المستخدم")+'</div>'+
      '<div class="small-muted">@'+escapeHtml(u.username||"")+' · '+escapeHtml(countryLabel(u.country))+' · '+escapeHtml(u.currency||"-")+'</div>'+
      '<div class="small-muted">الاشتراك: '+(u.expiresAt?fmtDate(u.expiresAt):"-")+'</div></div>'+
      '<button class="btn btn-danger btn-sm" id="detail-delete-user">حذف نهائي</button>'+
      '</div>';
    html+='<div class="stat-grid">'+statCard("المنتجات",products.length)+statCard("المخزون",moneyFor(stockValue,st))+statCard("المبيعات",moneyFor(totals.sales,st))+statCard("الأرباح",moneyFor(totals.profit,st))+statCard("الديون المتبقية",moneyFor(debtValue,st))+statCard("عدد عمليات الشراء",purchases.length)+'</div>';
    html+='<div class="tabs" id="admin-detail-tabs">'+
      '<button class="tab-btn active" data-tab="sales">المبيعات</button>'+
      '<button class="tab-btn" data-tab="purchases">المشتريات</button>'+
      '<button class="tab-btn" data-tab="debts">الديون</button>'+
      '<button class="tab-btn" data-tab="profits">الأرباح</button>'+
      '<button class="tab-btn" data-tab="inventory">المخزون</button>'+
      '</div>';
    html+='<div id="admin-detail-content"></div>';
    html+='<button class="btn btn-outline" id="admin-detail-close" style="margin-top:10px;">رجوع</button>';
    openModal("تفاصيل المستخدم",html,{onClose:function(){}});
    var content=document.getElementById("admin-detail-content");
    var currentTab="sales";
    var from="",to="";
    function draw(){
      var body='<div class="card admin-filter-card">'+
        '<div class="row-between"><div class="li-title">فلترة حسب التاريخ</div><button class="btn btn-ghost btn-sm" id="clear-admin-date">مسح</button></div>'+
        '<div style="display:flex;gap:8px;"><div class="field" style="flex:1;"><label>من تاريخ</label><input id="admin-date-from" type="date" value="'+from+'"></div><div class="field" style="flex:1;"><label>إلى تاريخ</label><input id="admin-date-to" type="date" value="'+to+'"></div></div>'+
        '<div class="chip-row" style="margin-bottom:0;"><button class="chip" data-quick="today">اليوم</button><button class="chip" data-quick="all">الكل</button></div></div>';
      var arr=[], empty="لا توجد بيانات ضمن الفترة المحددة.";
      if(currentTab==="sales") arr=sales.filter(function(x){return inRange(x.date,from,to);});
      else if(currentTab==="purchases") arr=purchases.filter(function(x){return inRange(x.date,from,to);});
      else if(currentTab==="debts") arr=debts.filter(function(x){return inRange(x.date,from,to);});
      if(currentTab==="inventory"){
        body+='<h2 class="section-title">كل المنتجات والمخزون</h2>';
        if(!products.length) body+='<div class="empty-state">لا توجد منتجات.</div>';
        else body+=products.map(function(p){return '<div class="list-item"><div class="avatar-circle">'+(p.type==="produce"?"🥕":"📦")+'</div><div class="li-main"><div class="li-title">'+escapeHtml(p.name)+'</div><div class="li-sub">باركود: '+escapeHtml(p.barcode||"-")+' · الكمية: '+p.qty+(p.unit==="kg"?" كغ":"")+'</div></div><div style="text-align:left"><div class="li-amt">'+fmtMoney(num(p.sellPrice),p.currency)+'</div><div class="small-muted">شراء: '+fmtMoney(num(p.buyPrice),p.currency)+'</div></div></div>';}).join("");
      }else if(currentTab==="profits"){
        var filteredSales=arr;
        var ps=sumSales(filteredSales);
        body+='<div class="stat-grid">'+statCard("المبيعات",moneyFor(ps.sales,st))+statCard("الأرباح",moneyFor(ps.profit,st))+statCard("عدد العمليات",filteredSales.length)+'</div>';
        body+='<h2 class="section-title">تفصيل الأرباح</h2>';
        if(!filteredSales.length) body+='<div class="empty-state">'+empty+'</div>';
        else body+=filteredSales.map(function(s){return '<div class="list-item"><div class="li-main"><div class="li-title">'+escapeHtml(s.invoiceNo||"فاتورة")+'</div><div class="li-sub">'+fmtDate(s.date)+' · '+s.items.length+' منتجات</div></div><div class="li-amt" style="color:var(--ok)">'+moneyFor(num(s.profitInBase),st)+'</div></div>';}).join("");
      }else if(currentTab==="sales"){
        body+='<h2 class="section-title">تفاصيل المبيعات ('+arr.length+')</h2>';
        if(!arr.length) body+='<div class="empty-state">'+empty+'</div>';
        else body+=arr.map(function(s){
          var items=(s.items||[]).map(function(it){return '<div class="invoice-row"><span>'+escapeHtml(it.name)+' × '+it.qty+(it.unit==="kg"?" كغ":"")+'</span><span>'+fmtMoney(num(it.total),it.currency)+'</span></div>';}).join("");
          return '<div class="card"><div class="row-between"><div><div class="li-title">'+escapeHtml(s.invoiceNo||"فاتورة")+'</div><div class="li-sub">'+fmtDate(s.date)+'</div></div><div class="li-amt">'+fmtMoney(num(s.total),s.paymentCurrency||base)+'</div></div><div class="small-muted" style="margin-top:8px;">طريقة الدفع: '+escapeHtml(s.paymentMethod||"-")+(s.customerName?" · الزبون: "+escapeHtml(s.customerName):"")+'</div><div class="divider"></div>'+items+'<div class="invoice-total"><span>الربح</span><span>'+moneyFor(num(s.profitInBase),st)+'</span></div></div>';
        }).join("");
      }else if(currentTab==="purchases"){
        body+='<h2 class="section-title">تفاصيل المشتريات ('+arr.length+')</h2>';
        if(!arr.length) body+='<div class="empty-state">'+empty+'</div>';
        else body+=arr.map(function(p){return '<div class="list-item"><div class="li-main"><div class="li-title">'+escapeHtml(p.name)+'</div><div class="li-sub">'+fmtDate(p.date)+(p.supplier?" · المورد: "+escapeHtml(p.supplier):"")+'</div></div><div style="text-align:left"><div class="li-amt">'+p.qty+'</div><div class="small-muted">'+fmtMoney(num(p.buyPrice),p.currency)+' / وحدة</div></div></div>';}).join("");
      }else if(currentTab==="debts"){
        body+='<h2 class="section-title">تفاصيل الديون ('+arr.length+')</h2>';
        if(!arr.length) body+='<div class="empty-state">'+empty+'</div>';
        else body+=arr.map(function(d){var badge=d.status==="paid"?'<span class="badge ok">مسدد</span>':d.status==="partial"?'<span class="badge warn">جزئي</span>':'<span class="badge danger">غير مسدد</span>';return '<div class="card"><div class="row-between"><div><div class="li-title">'+escapeHtml(d.customerName||"بدون اسم")+' '+badge+'</div><div class="li-sub">'+fmtDate(d.date)+(d.phone?" · "+escapeHtml(d.phone):"")+'</div></div><div class="li-amt">'+fmtMoney(num(d.remaining),d.currency)+'</div></div><div class="invoice-row"><span>الإجمالي</span><span>'+fmtMoney(num(d.amount),d.currency)+'</span></div><div class="invoice-row"><span>المدفوع</span><span>'+fmtMoney(num(d.paidAmount),d.currency)+'</span></div></div>';}).join("");
      }
      content.innerHTML=body;
      var fi=document.getElementById("admin-date-from"), ti=document.getElementById("admin-date-to");
      if(fi) fi.addEventListener("change",function(){from=fi.value;draw();});
      if(ti) ti.addEventListener("change",function(){to=ti.value;draw();});
      var clear=document.getElementById("clear-admin-date"); if(clear) clear.addEventListener("click",function(){from="";to="";draw();});
      content.querySelectorAll("[data-quick]").forEach(function(b){b.addEventListener("click",function(){var q=b.getAttribute("data-quick");if(q==="today"){var d=new Date();var x=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");from=x;to=x;}else{from="";to="";}draw();});});
    }
    document.querySelectorAll("#admin-detail-tabs .tab-btn").forEach(function(b){b.addEventListener("click",function(){currentTab=b.getAttribute("data-tab");document.querySelectorAll("#admin-detail-tabs .tab-btn").forEach(function(x){x.classList.remove("active")});b.classList.add("active");draw();});});
    document.getElementById("admin-detail-close").addEventListener("click",closeModal);
    document.getElementById("detail-delete-user").addEventListener("click",function(){closeModal();openDeleteModal(userId);});
    draw();
  }

/* ========================= تسجيل الدخول / الشروط / بدء الجلسة ========================= */
function renderLoginScreen(message){
  var app = document.getElementById("app");
  var tb = document.getElementById("topbar"); if(tb) tb.style.display = "none";
  var bn = document.getElementById("bottom-nav"); if(bn) bn.style.display = "none";
  var configMissing = !sb;
  var html = '<div style="padding-top:18px;text-align:center;">';
  html += '<div style="font-size:40px;">🏪</div>';
  html += '<div style="font-weight:800;font-size:20px;margin:8px 0 20px;">ميني ماركت</div>';
  html += '</div>';
  if(configMissing){
    html += '<div class="card" style="border:1px solid var(--danger);"><div style="color:var(--danger);font-weight:700;">لم يتم ضبط إعدادات Supabase بعد. الرجاء وضع SUPABASE_URL وSUPABASE_ANON_KEY داخل رأس الملف.</div></div>';
  }
  html += '<div class="card">';
  if(message){ html += '<div class="hint" style="color:var(--danger);margin-bottom:8px;">'+escapeHtml(message)+'</div>'; }
  html += '<div class="field"><label>اسم المستخدم</label><input id="lg-username" type="text" autocomplete="username"></div>';
  html += '<div class="field"><label>كلمة المرور</label><input id="lg-password" type="password" autocomplete="current-password"></div>';
  html += '<button class="btn btn-primary" id="lg-submit" style="margin-top:14px;" '+(configMissing?"disabled":"")+'>تسجيل الدخول</button>';
  html += '</div>';
  app.innerHTML = html;

  function doLogin(){
    var u = document.getElementById("lg-username").value.trim();
    var p = document.getElementById("lg-password").value;
    if(!u || !p){ toast("الرجاء إدخال اسم المستخدم وكلمة المرور", "err"); return; }
    var btn = document.getElementById("lg-submit");
    btn.disabled = true; btn.textContent = "جارٍ الدخول...";
    rpc("mm_login", {p_username:u, p_password:p}).then(function(res){
      if(!res || !res.ok){
        btn.disabled = false; btn.textContent = "تسجيل الدخول";
        toast((res && res.message) || "تعذر تسجيل الدخول", "err"); return;
      }
      Auth.setToken(res.sessionToken);
      Auth.user = res.user;
      return rpc("mm_get_state", {p_session_token:Auth.token}).then(function(stateRes){
        btn.disabled = false; btn.textContent = "تسجيل الدخول";
        if(!stateRes || !stateRes.ok){ toast((stateRes && stateRes.message)||"تعذر تحميل البيانات", "err"); Auth.setToken(null); return; }
        applyRemoteState(stateRes);
        proceedAfterLogin();
      });
    }).catch(function(){
      btn.disabled = false; btn.textContent = "تسجيل الدخول";
      toast("تعذر الاتصال بالخادم", "err");
    });
  }
  document.getElementById("lg-submit").addEventListener("click", doLogin);
  document.getElementById("lg-password").addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
}

function proceedAfterLogin(){
  if(!Auth.user || !Auth.user.termsAccepted){ renderTermsGate(); }
  else{ startApp(); }
}

function renderTermsGate(){
  var app = document.getElementById("app");
  var html = '<h2 class="section-title">الشروط وسياسة الخصوصية</h2>';
  html += '<div class="card" style="max-height:50vh;overflow-y:auto;font-size:13.5px;line-height:1.8;">';
  html += 'باستخدامك لتطبيق "ميني ماركت" فإنك توافق على ما يلي:<br><br>'+
    '1. يتم تخزين بيانات حسابك ومنتجاتك ومبيعاتك ومشترياتك بشكل آمن.<br>'+
    '2. يستطيع مدير النظام (Admin) مراجعة البيانات المتعلقة باستخدامك للنظام ضمن الصلاحيات المحددة، بهدف الدعم الفني ومتابعة الاشتراك.<br>'+
    '3. أنت مسؤول عن سرية بيانات الدخول الخاصة بك.<br>'+
    '4. قد يتم إيقاف الحساب تلقائياً عند انتهاء مدة الاشتراك.<br>';
  html += '</div>';
  html += '<div class="row-between" style="margin-top:14px;"><span>أوافق على الشروط وسياسة الخصوصية</span><input type="checkbox" id="terms-check" style="width:22px;height:22px;"></div>';
  html += '<button class="btn btn-primary" id="terms-submit" style="margin-top:14px;" disabled>متابعة</button>';
  app.innerHTML = html;
  document.getElementById("terms-check").addEventListener("change", function(e){
    document.getElementById("terms-submit").disabled = !e.target.checked;
  });
  document.getElementById("terms-submit").addEventListener("click", function(){
    rpc("mm_accept_terms", {p_session_token:Auth.token, p_accepted:true}).then(function(res){
      if(!res || !res.ok){ toast((res&&res.message)||"تعذر تسجيل الموافقة", "err"); return; }
      Auth.user = res.user;
      startApp();
    }).catch(function(){ toast("تعذر الاتصال بالخادم", "err"); });
  });
}

function startApp(){
  var tb = document.getElementById("topbar"); if(tb) tb.style.display = "";
  var bn = document.getElementById("bottom-nav"); if(bn) bn.style.display = "";
  navigate("home");
  startPolling();
}

function initApp(){
  if(!sb || !Auth.token){ renderLoginScreen(null); return; }
  rpc("mm_get_state", {p_session_token:Auth.token}).then(function(res){
    if(!res || !res.ok){ Auth.setToken(null); renderLoginScreen(res && res.message); return; }
    applyRemoteState(res);
    proceedAfterLogin();
  }).catch(function(){
    toast("تعذر الاتصال بالخادم، سيتم استخدام آخر نسخة محفوظة محلياً إن وجدت", "err", 3500);
    if(Auth.user){ startApp(); } else { renderLoginScreen("تعذر الاتصال بالخادم. تحقق من الإنترنت."); }
  });
}

/* ========================= بدء التطبيق ========================= */
document.addEventListener("click", function(e){
  var closeAttr = e.target.getAttribute && e.target.getAttribute("data-close-modal");
  if(closeAttr!==null && closeAttr!==undefined){ closeModal(); }
});

// إيقاف الكاميرا عند إخفاء الصفحة لتوفير البطارية، وإعادة تشغيلها عند العودة
document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    // نُبقي الحالة كما هي؛ لا نغلق المسح تلقائيًا حتى لا نفاجئ المستخدم، لكن نوقف المسارات لتوفير البطارية
  }
});

initApp();
})();
</script>
