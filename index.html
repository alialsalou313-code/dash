<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dash Lebanon — Everyday finds, delivered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#2952E3; --primary-dk:#1B3AAE; --accent:#F5A623;
  --bg:#F7F8FB; --surface:#FFFFFF; --text:#0F1729; --muted:#5B6478;
  --border:#E4E8F0; --success:#1C9A5B; --danger:#E0433E;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 2px 10px rgba(15,23,41,.05), 0 10px 30px rgba(15,23,41,.06);
  --shadow-lg:0 20px 60px rgba(15,23,41,.14);
  --font-d:'Manrope',sans-serif; --font-b:'Inter',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-dark="1"]{
  --bg:#0B1220; --surface:#121B2E; --text:#EDF1F8; --muted:#8B94A8;
  --border:#232E45; --shadow:0 2px 10px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:var(--font-d)}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--primary);color:#fff}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hide{display:none!important}
.container{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---- announcement ---- */
#announce{background:linear-gradient(90deg,var(--primary),var(--primary-dk));color:#fff;text-align:center;font-size:.82rem;font-weight:600;padding:9px 14px;letter-spacing:.2px}

/* ---- header ---- */
header.site{position:sticky;top:0;z-index:200;background:rgba(247,248,251,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
[data-dark="1"] header.site{background:rgba(11,18,32,.85)}
.hbar{display:flex;align-items:center;gap:18px;padding:14px 20px;max-width:1180px;margin:0 auto}
.brand{font-family:var(--font-d);font-weight:800;font-size:1.35rem;letter-spacing:-.5px;display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.nav-links{display:none;gap:4px;margin-inline-start:8px}
@media(min-width:860px){.nav-links{display:flex}}
.nav-links button{background:none;border:none;padding:9px 14px;border-radius:50px;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s}
.nav-links button:hover,.nav-links button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.hbar-right{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;position:relative;transition:.2s;flex-shrink:0}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#1a1300;font-size:.62rem;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.burger{display:flex;flex-direction:column;gap:4px;width:20px}
.burger span{height:2px;background:var(--text);border-radius:2px}
@media(min-width:860px){.burger-btn{display:none}}

/* mobile drawer */
.drawer-ov{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:300;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(2px)}
.drawer-ov.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;left:-300px;width:290px;height:100%;background:var(--surface);z-index:310;transition:left .3s var(--ease);display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{left:0}
.drawer-head{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.drawer nav{padding:10px 0;flex:1}
.drawer nav button{width:100%;text-align:left;background:none;border:none;padding:14px 20px;font-size:.95rem;font-weight:600;color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:center}
.drawer nav button:hover{background:var(--bg)}
.drawer-foot{padding:16px 20px;border-top:1px solid var(--border)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:13px 20px;font-weight:700;font-size:.92rem;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 24px rgba(41,82,227,.28)}
.btn-primary:hover{box-shadow:0 14px 30px rgba(41,82,227,.36);transform:translateY(-1px)}
.btn-accent{background:var(--accent);color:#1a1300;box-shadow:0 10px 24px rgba(245,166,35,.3)}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:#FCEBEA;color:var(--danger)}
.btn-sm{width:auto;padding:9px 16px;font-size:.82rem;border-radius:10px}
.btn-icon-only{width:44px;padding:0;flex-shrink:0}

/* ---- layout helpers ---- */
.page{max-width:1180px;margin:0 auto;padding:26px 20px 90px;min-height:60vh}
.back-link{background:none;border:none;color:var(--muted);font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px}
.back-link:hover{color:var(--primary)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-title{font-size:1.3rem;font-weight:800;letter-spacing:-.3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,var(--primary),#1435A0);color:#fff;padding:52px 32px;margin:20px 0 26px;box-shadow:0 24px 60px rgba(27,58,174,.28)}
.hero::before{content:'';position:absolute;top:-100px;right:-100px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::after{content:'';position:absolute;bottom:-80px;left:15%;width:200px;height:200px;border-radius:50%;background:rgba(245,166,35,.18)}
.hero-in{position:relative;z-index:1;max-width:560px}
.hero h1{font-size:2.1rem;font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:12px}
.hero p{opacity:.88;font-size:1rem;line-height:1.6;margin-bottom:22px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-cta .btn{width:auto;padding:13px 24px}
@media(max-width:640px){.hero{padding:36px 22px}.hero h1{font-size:1.6rem}}

/* ---- category pills / search ---- */
.cats-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.cats-row::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:9px 16px;border-radius:50px;border:1.5px solid var(--border);background:var(--surface);font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s;color:var(--muted)}
.pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.search-wrap{position:relative;margin-bottom:18px}
.search-inp{width:100%;padding:15px 46px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);font-size:.95rem;outline:none;transition:.2s}
.search-inp:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(41,82,227,.1)}
.search-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:none;border-radius:50%;background:var(--bg);color:var(--muted);display:none;align-items:center;justify-content:center;cursor:pointer}
.search-clr.show{display:flex}
.sort-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sort-btn{background:var(--surface);border:1.5px solid var(--border);color:var(--muted);font-size:.78rem;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer}
.sort-btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.result-count{font-size:.8rem;color:var(--muted);margin-inline-start:auto}

/* ---- product grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.grid-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.pcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.pcard-img{position:relative;aspect-ratio:1;background:var(--bg);overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover .pcard-img img{transform:scale(1.06)}
.chip-corner{position:absolute;top:10px;left:10px;background:var(--danger);color:#fff;font-size:.68rem;font-weight:800;padding:4px 9px;border-radius:20px}
.chip-corner.bundle{left:auto;right:10px;background:linear-gradient(135deg,var(--accent),#e2861a);color:#1a1300}
.wish-btn{position:absolute;bottom:10px;right:10px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.wish-btn.active{color:#E0433E}
.pcard-body{padding:14px 15px}
.pcard-name{font-size:.92rem;font-weight:700;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pcard-old{font-size:.74rem;color:var(--muted);text-decoration:line-through}
.pcard-price{color:var(--primary);font-size:1.08rem;font-weight:800}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:.72rem;color:var(--accent);font-weight:800}
.stars{color:#F5A623;font-size:.78rem;letter-spacing:1px}
.empty-box{grid-column:1/-1;text-align:center;padding:70px 20px}
.empty-ico{font-size:2.6rem;margin-bottom:12px;opacity:.6}
.empty-ttl{font-weight:800;font-size:1.05rem;margin-bottom:6px}
.empty-sub{color:var(--muted);font-size:.88rem}
.skel{background:linear-gradient(100deg,var(--border) 30%,var(--bg) 50%,var(--border) 70%);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---- product detail ---- */
.pd-wrap{display:grid;grid-template-columns:1fr;gap:28px}
@media(min-width:820px){.pd-wrap{grid-template-columns:1fr 1fr}}
.pd-gallery-main{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1;background:var(--surface);border:1px solid var(--border);margin-bottom:10px}
.pd-gallery-main img{width:100%;height:100%;object-fit:cover}
.pd-thumbs{display:flex;gap:8px;overflow-x:auto}
.pd-thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.pd-thumb.on{border-color:var(--primary)}
.pd-thumb img{width:100%;height:100%;object-fit:cover}
.pd-name{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.pd-rating{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.85rem;color:var(--muted)}
.pd-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.pd-price{font-size:1.6rem;font-weight:800;color:var(--primary)}
.pd-old{color:var(--muted);text-decoration:line-through;font-size:.95rem}
.pd-lbp{color:var(--muted);font-size:.82rem;margin-bottom:14px}
.pd-desc{color:var(--muted);line-height:1.75;font-size:.93rem;margin-bottom:16px;white-space:pre-line}
.spec-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:.85rem}
.spec-table tr{border-bottom:1px solid var(--border)}
.spec-table td{padding:9px 4px;color:var(--muted)}
.spec-table td:last-child{text-align:right;color:var(--text);font-weight:600}
.bundle-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.bopt{border:2px solid var(--border);border-radius:14px;padding:14px;text-align:center;cursor:pointer;position:relative;background:var(--surface)}
.bopt.on{border-color:var(--accent);background:rgba(245,166,35,.06)}
.bopt-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1a1300;font-size:.6rem;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px}
.qty-ctrl{display:flex;align-items:center;gap:10px}
.qbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--primary);background:transparent;color:var(--primary);font-weight:800;cursor:pointer}
.qty-val{width:40px;text-align:center;font-weight:800;border:none;background:none;font-size:1rem}
.pts-chip{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:10px;padding:9px 14px;font-size:.82rem;font-weight:700;color:#8a6614;margin-bottom:16px;display:flex;align-items:center;gap:6px}
[data-dark="1"] .pts-chip{color:var(--accent)}
.pd-actions{display:flex;gap:10px}

/* ---- cart / list rows ---- */
.ci-row{display:flex;gap:14px;padding:16px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:12px}
.ci-row img{width:76px;height:76px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--bg)}
.ci-body{flex:1;min-width:0}
.ci-name{font-weight:700;font-size:.92rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-meta{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.ci-ctrls{display:flex;align-items:center;gap:8px}
.mini-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-weight:800}
.ci-sub{margin-inline-start:auto;font-weight:800;color:var(--primary)}
.ci-rm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;align-self:flex-start}
.ci-rm:hover{color:var(--danger)}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;font-size:.9rem;border-bottom:1px solid var(--border)}
.summary-row:last-child{border-bottom:none}
.summary-row.total{font-weight:800;font-size:1.05rem;color:var(--primary)}
.sticky-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 20px;box-shadow:0 -8px 24px rgba(0,0,0,.06);z-index:90}
.sticky-bar-in{max-width:1180px;margin:0 auto;display:flex;gap:10px}

/* ---- forms ---- */
.fgroup{margin-bottom:14px}
.flabel{display:block;font-size:.84rem;font-weight:700;margin-bottom:6px}
.flabel .req{color:var(--danger)}
.finput,.ftextarea,.fselect{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);font-size:.9rem;outline:none;transition:.2s}
.finput:focus,.ftextarea:focus,.fselect:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(41,82,227,.1)}
.finput.inv{border-color:var(--danger)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.frow2{grid-template-columns:1fr}}
.ftextarea{min-height:90px;resize:vertical}
.form-card{padding:22px;margin-bottom:16px}
.form-title{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.alert{padding:12px 15px;border-radius:12px;font-size:.85rem;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.alert-err{background:#FCEBEA;color:#8f2622}
.alert-ok{background:#E7F7EE;color:#0f6b3d}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--bg);padding:4px;border-radius:12px}
.auth-tab{flex:1;padding:10px;border:none;background:none;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.auth-tab.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ---- misc pages ---- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-box{padding:18px;text-align:center}
.stat-num{font-size:1.6rem;font-weight:800;color:var(--primary)}
.stat-lbl{font-size:.76rem;color:var(--muted);margin-top:2px}
.order-row{padding:18px;margin-bottom:14px}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.order-num{font-weight:800}
.order-date{font-size:.76rem;color:var(--muted);margin-top:2px}
.status-badge{font-size:.7rem;font-weight:800;padding:5px 12px;border-radius:20px;white-space:nowrap}
.st-pending{background:#FFF3D6;color:#8a6614}
.st-confirmed,.st-processing{background:#E4ECFB;color:var(--primary)}
.st-shipping{background:#EDE7FB;color:#5D3EC1}
.st-delivered{background:#E7F7EE;color:#0f6b3d}
.st-cancelled{background:#FCEBEA;color:#8f2622}
.track-steps{display:flex;justify-content:space-between;margin:14px 0 4px;position:relative}
.track-steps::before{content:'';position:absolute;top:13px;left:6%;right:6%;height:2px;background:var(--border)}
.track-step{flex:1;text-align:center;position:relative;z-index:1}
.track-dot{width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--border);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:var(--muted)}
.track-dot.done{background:var(--primary);border-color:var(--primary);color:#fff}
.track-lbl{font-size:.66rem;color:var(--muted);font-weight:700}
.profile-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.avatar-circ{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;flex-shrink:0}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:var(--r-md);cursor:pointer;font-weight:600;font-size:.9rem}
.menu-item:hover{background:var(--surface)}
.pts-hero{background:linear-gradient(135deg,var(--accent),#D9860D);border-radius:var(--r-lg);padding:30px 24px;text-align:center;color:#241a02;margin-bottom:18px}
.pts-hero-num{font-size:2.6rem;font-weight:800}
.rank-badge{display:inline-block;background:rgba(255,255,255,.4);padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:800;margin-top:6px}
.tiers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(min-width:600px){.tiers{grid-template-columns:repeat(4,1fr)}}
.tier{padding:16px 10px;text-align:center}
.tier.on{border-color:var(--accent);background:rgba(245,166,35,.06)}
.tier-name{font-weight:800;font-size:.85rem}
.tier-req{font-size:.7rem;color:var(--muted);margin:3px 0}
.tier-pct{font-weight:800;color:var(--success);font-size:.8rem}
.review-item{padding:16px 0;border-bottom:1px solid var(--border)}
.review-item:last-child{border-bottom:none}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.review-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.review-name{font-weight:700;font-size:.86rem}
.review-date{font-size:.72rem;color:var(--muted)}
.review-text{font-size:.87rem;color:var(--text);line-height:1.6}
.star-pick{display:flex;gap:6px;font-size:1.5rem;margin-bottom:12px;cursor:pointer}
.star-pick span{color:var(--border);transition:.15s}
.star-pick span.on{color:var(--accent)}

/* ---- footer ---- */
footer.site{background:var(--surface);border-top:1px solid var(--border);margin-top:40px;padding:40px 20px 24px}
.footer-in{max-width:1180px;margin:0 auto}
.footer-top{display:grid;grid-template-columns:1fr;gap:26px;margin-bottom:26px}
@media(min-width:640px){.footer-top{grid-template-columns:1.3fr 1fr 1fr}}
.footer-brand{font-family:var(--font-d);font-weight:800;font-size:1.2rem}
.footer-tag{color:var(--muted);font-size:.85rem;margin-top:6px;max-width:280px;line-height:1.6}
.footer-h{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}
.footer-col a,.footer-col button{display:block;background:none;border:none;color:var(--muted);font-size:.86rem;padding:6px 0;cursor:pointer;text-align:left}
.footer-col a:hover,.footer-col button:hover{color:var(--primary)}
.footer-bottom{border-top:1px solid var(--border);padding-top:18px;text-align:center;color:var(--muted);font-size:.76rem}
.soc-row{display:flex;gap:8px;margin-top:10px}
.soc-row a{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.85rem}

/* ---- toast / modal ---- */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:50px;font-size:.85rem;font-weight:600;z-index:999;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-ov{position:fixed;inset:0;background:rgba(10,14,25,.55);z-index:400;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
@media(min-width:620px){.modal-ov{align-items:center}}
.modal-sheet{background:var(--surface);border-radius:22px 22px 0 0;padding:24px 20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
@media(min-width:620px){.modal-sheet{border-radius:22px}}
.modal-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:1.1rem;font-weight:800;margin-bottom:16px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin-dark{border-color:rgba(0,0,0,.15);border-top-color:var(--primary)}
@keyframes sp{to{transform:rotate(360deg)}}
.wa-fab{position:fixed;bottom:90px;right:18px;z-index:80;width:54px;height:54px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,211,102,.4);color:#fff;font-size:1.5rem}
.loading-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loading-screen .brand{font-size:1.6rem}
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen"><div class="brand">Dash <span style="color:var(--accent)">Lebanon</span></div><div class="spin spin-dark" style="width:26px;height:26px"></div></div>

<div id="announce"></div>

<header class="site">
  <div class="hbar">
    <button class="icon-btn burger-btn" onclick="openDrawer()" aria-label="Menu"><div class="burger"><span></span><span></span><span></span></div></button>
    <div class="brand" onclick="nav('home')"><span class="dot"></span> Dash <span style="color:var(--accent)">Lebanon</span></div>
    <nav class="nav-links">
      <button onclick="nav('home')" data-nav="home">Home</button>
      <button onclick="nav('home',{offers:true})" data-nav="offers">Offers</button>
      <button onclick="nav('wishlist')" data-nav="wishlist">Wishlist</button>
      <button onclick="nav('orders')" data-nav="orders">Orders</button>
      <button onclick="nav('contact')" data-nav="contact">Contact</button>
    </nav>
    <div class="hbar-right">
      <button class="icon-btn" onclick="toggleDark()" id="dm-btn" title="Toggle theme">🌙</button>
      <button class="icon-btn" onclick="nav('account')" title="Account">👤</button>
      <button class="icon-btn" onclick="nav('cart')" title="Cart">🛒<span class="badge hide" id="cart-badge">0</span></button>
    </div>
  </div>
</header>

<div class="drawer-ov" id="drawer-ov" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><div class="brand" style="font-size:1.1rem">Dash <span style="color:var(--accent)">Lebanon</span></div><button class="icon-btn" onclick="closeDrawer()">✕</button></div>
  <nav>
    <button onclick="nav('home');closeDrawer()">🏠 Home</button>
    <button onclick="nav('home',{offers:true});closeDrawer()">🔥 Offers</button>
    <button onclick="nav('wishlist');closeDrawer()">♡ Wishlist</button>
    <button onclick="nav('orders');closeDrawer()">📦 My Orders</button>
    <button onclick="nav('points');closeDrawer()">★ My Points</button>
    <button onclick="nav('account');closeDrawer()">👤 Account</button>
    <button onclick="nav('contact');closeDrawer()">✉ Contact</button>
  </nav>
  <div class="drawer-foot"><a class="btn btn-primary" style="background:#25D366" href="#" id="drawer-wa" target="_blank">Chat on WhatsApp</a></div>
</div>

<div id="app"></div>

<footer class="site" id="site-footer">
  <div class="footer-in">
    <div class="footer-top">
      <div><div class="footer-brand">Dash <span style="color:var(--accent)">Lebanon</span></div><div class="footer-tag" id="footer-tag">Everyday products, delivered fast — cash on delivery, anywhere in Lebanon.</div>
        <div class="soc-row" id="footer-soc"></div>
      </div>
      <div class="footer-col"><div class="footer-h">Shop</div>
        <button onclick="nav('home')">Home</button>
        <button onclick="nav('home',{offers:true})">Offers</button>
        <button onclick="nav('wishlist')">Wishlist</button>
        <button onclick="nav('orders')">My Orders</button>
      </div>
      <div class="footer-col"><div class="footer-h">Contact</div>
        <a id="footer-wa" target="_blank">WhatsApp</a>
        <a id="footer-email">Email</a>
        <button onclick="nav('contact')">Contact form</button>
      </div>
    </div>
    <div class="footer-bottom">© <span id="footer-year"></span> Dash Lebanon. All rights reserved.</div>
  </div>
</footer>

<a class="wa-fab" id="wa-fab" target="_blank">💬</a>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   CONFIG
========================================================= */
const SUPABASE_URL='https://ofwiumldjvqjaxdovhbg.supabase.co';
const SUPABASE_KEY='sb_publishable_Heze4b0HvccuTzSVpe8Dfw_eenNj-q3';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* =========================================================
   GLOBAL STATE
========================================================= */
const S={
  page:'home',data:null,history:[],
  dark:localStorage.getItem('dl_dark')==='1',
  settings:null,categories:[],products:[],
  session:null,profile:null,
  cart:JSON.parse(localStorage.getItem('dl_cart')||'[]'),
  wishlist:[],           // product ids
  cat:'all',search:'',offersOnly:false,sort:'def',
  dqty:1,buyMode:'normal',
  currentOrder:null,
};

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){const x=parseFloat(n);return isNaN(x)?'$0.00':'$'+x.toFixed(2)}
function fmtLBP(n){if(!S.settings)return'';return Math.round(parseFloat(n)*S.settings.currency_rate).toLocaleString('en')+' LBP'}
let toastTimer;
function toast(msg){const el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=msg;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function saveCart(){localStorage.setItem('dl_cart',JSON.stringify(S.cart))}
function cartCount(){return S.cart.reduce((s,i)=>s+i.qty,0)}
function cartSub(){return parseFloat(S.cart.reduce((s,i)=>s+i.price*i.qty,0).toFixed(2))}
function cartDelivery(){return S.cart.length?Math.max(...S.cart.map(i=>i.delivery_price||0)):0}
function cartTotal(){return parseFloat((cartSub()+cartDelivery()-(S.appliedDiscount||0)).toFixed(2))}
function updateCartBadge(){const c=cartCount();const b=document.getElementById('cart-badge');b.textContent=c;b.classList.toggle('hide',!c)}

/* =========================================================
   BOOT
========================================================= */
async function boot(){
  applyDark();
  const [{data:{session}},settingsRes,catRes,prodRes]=await Promise.all([
    sb.auth.getSession(),
    sb.from('settings').select('*').eq('id',1).maybeSingle(),
    sb.from('categories').select('*').eq('is_active',true).order('sort_order'),
    sb.from('products').select('*, product_images(id,url,sort_order)').eq('is_active',true).order('created_at',{ascending:false})
  ]);
  S.session=session;
  S.settings=settingsRes.data||{store_name:'Dash Lebanon',currency_rate:90000,points_per_dollar:7,cancel_fee:4,free_cancel_hours:24,whatsapp_number:'96181877323',contact_email:'',instagram_url:'',facebook_url:'',tiktok_url:'',hero_title:'Everyday products, delivered fast.',hero_subtitle:'Quality home, kitchen & beauty finds — cash on delivery, anywhere in Lebanon.',announcement:''};
  S.categories=catRes.data||[];
  S.products=prodRes.data||[];
  applySettingsToChrome();
  if(session)await loadProfileAndWishlist();
  sb.auth.onAuthStateChange(async(event,sess)=>{
    S.session=sess;
    if(sess)await loadProfileAndWishlist(); else {S.profile=null;S.wishlist=[]}
    updateChromeAuth();
  });
  document.getElementById('loading-screen').style.display='none';
  render();updateCartBadge();updateChromeAuth();
}
async function loadProfileAndWishlist(){
  const uid=S.session.user.id;
  const[{data:profile},{data:wl}]=await Promise.all([
    sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
    sb.from('wishlists').select('product_id').eq('user_id',uid)
  ]);
  S.profile=profile;S.wishlist=(wl||[]).map(w=>w.product_id);
}
function applySettingsToChrome(){
  const st=S.settings;
  document.title=st.store_name+' — '+(st.hero_title||'Shop');
  const ann=document.getElementById('announce');
  if(st.announcement){ann.textContent=st.announcement;ann.classList.remove('hide')}else ann.classList.add('hide');
  document.getElementById('footer-tag').textContent=st.hero_subtitle||'';
  document.getElementById('footer-year').textContent=new Date().getFullYear();
  const wa='https://wa.me/'+(st.whatsapp_number||'').replace(/\D/g,'');
  document.getElementById('wa-fab').href=wa;document.getElementById('drawer-wa').href=wa;document.getElementById('footer-wa').href=wa;
  document.getElementById('footer-email').href='mailto:'+(st.contact_email||'');
  document.getElementById('footer-email').textContent=st.contact_email||'';
  let soc='';
  if(st.instagram_url)soc+=`<a href="${esc(st.instagram_url)}" target="_blank">IG</a>`;
  if(st.facebook_url)soc+=`<a href="${esc(st.facebook_url)}" target="_blank">FB</a>`;
  if(st.tiktok_url)soc+=`<a href="${esc(st.tiktok_url)}" target="_blank">TT</a>`;
  document.getElementById('footer-soc').innerHTML=soc;
}
function updateChromeAuth(){
  document.querySelectorAll('.nav-links button').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.page));
}

/* =========================================================
   DARK MODE
========================================================= */
function applyDark(){document.documentElement.setAttribute('data-dark',S.dark?'1':'0');const b=document.getElementById('dm-btn');if(b)b.textContent=S.dark?'☀️':'🌙'}
function toggleDark(){S.dark=!S.dark;localStorage.setItem('dl_dark',S.dark?'1':'0');applyDark()}

/* =========================================================
   ROUTER
========================================================= */
function nav(page,data=null,push=true){
  if(push&&S.page!==page){S.history.push({page:S.page,data:S.data});if(S.history.length>25)S.history.shift()}
  S.page=page;S.data=data;
  if(page==='home'&&data&&data.offers){S.offersOnly=true;S.cat='offers'}
  if(page!=='product'){S.dqty=1;S.buyMode='normal'}
  render();window.scrollTo(0,0);updateChromeAuth();closeDrawer();
}
function goBack(){if(S.history.length){const p=S.history.pop();nav(p.page,p.data,false)}else nav('home',null,false)}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drawer-ov').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawer-ov').classList.remove('open')}

const app=()=>document.getElementById('app');
function showFooterCart(hide){document.getElementById('site-footer').classList.toggle('hide',hide)}

function render(){
  const noFooter=['cart','checkout'];
  showFooterCart(noFooter.includes(S.page));
  switch(S.page){
    case'home':app().innerHTML=pHome();bindHome();break;
    case'product':pProduct();break;
    case'cart':app().innerHTML=pCart();break;
    case'checkout':app().innerHTML=pCheckout();break;
    case'success':app().innerHTML=pSuccess();break;
    case'orders':pOrders();break;
    case'order-detail':pOrderDetail();break;
    case'wishlist':pWishlist();break;
    case'points':pPoints();break;
    case'account':pAccount();break;
    case'contact':app().innerHTML=pContact();break;
    default:app().innerHTML=pHome();bindHome();
  }
}

/* =========================================================
   PRODUCT HELPERS
========================================================= */
function discPct(oldP,p){if(!oldP||oldP<=p)return 0;return Math.round((1-p/oldP)*100)}
function coverImg(p){return p.cover_image||(p.product_images&&p.product_images[0]&&p.product_images[0].url)||'https://placehold.co/400x400/e7ebf3/98a2b8?text=No+Image'}
function isWished(id){return S.wishlist.includes(id)}
function calcEarnPts(total){return Math.round(total*(S.settings.points_per_dollar||7))}

async function toggleWish(id,ev){
  if(ev)ev.stopPropagation();
  if(!S.session){toast('Log in to save favorites');nav('account');return}
  const uid=S.session.user.id;
  if(isWished(id)){
    await sb.from('wishlists').delete().eq('user_id',uid).eq('product_id',id);
    S.wishlist=S.wishlist.filter(x=>x!==id);
  }else{
    await sb.from('wishlists').insert({user_id:uid,product_id:id});
    S.wishlist.push(id);
  }
  document.querySelectorAll(`.wish-btn[data-pid="${id}"]`).forEach(b=>b.classList.toggle('active',isWished(id)));
}

/* =========================================================
   HOME PAGE
========================================================= */
function catLabel(cat){if(cat==='all')return'All';if(cat==='offers')return'Offers';const c=S.categories.find(x=>x.slug===cat);return c?c.name:cat}
function buildCatPills(){
  const items=[{slug:'all',name:'All'},...S.categories,{slug:'offers',name:'Offers'}];
  return items.map(c=>{
    const count=c.slug==='all'?S.products.length:c.slug==='offers'?S.products.filter(p=>p.compare_at_price>p.price||p.bundle_qty).length:S.products.filter(p=>p.category_id===c.id).length;
    return `<button class="pill ${S.cat===c.slug?'on':''}" onclick="setCat('${c.slug}')">${esc(c.name)} <span style="opacity:.6">${count}</span></button>`;
  }).join('');
}
function setCat(slug){S.cat=slug;S.offersOnly=(slug==='offers');document.getElementById('pgrid').innerHTML=buildGrid();document.getElementById('cats-row').innerHTML=buildCatPills()}
function setSort(s){S.sort=s;document.getElementById('pgrid').innerHTML=buildGrid();document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('on',b.dataset.sort===s))}
let searchDebounce;
function doSearch(v){
  S.search=v;
  document.getElementById('search-clr').classList.toggle('show',v.length>0);
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(()=>{document.getElementById('pgrid').innerHTML=buildGrid()},150);
}
function clearSearchInp(){S.search='';document.getElementById('search-field').value='';document.getElementById('search-clr').classList.remove('show');document.getElementById('pgrid').innerHTML=buildGrid()}

function filteredProducts(){
  let list=S.products;
  if(S.cat==='offers')list=list.filter(p=>p.compare_at_price>p.price||p.bundle_qty);
  else if(S.cat!=='all')list=list.filter(p=>{const c=S.categories.find(x=>x.slug===S.cat);return c&&p.category_id===c.id});
  const q=S.search.trim().toLowerCase();
  if(q)list=list.filter(p=>p.name.toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q));
  if(S.sort==='price_asc')list=[...list].sort((a,b)=>a.price-b.price);
  else if(S.sort==='price_desc')list=[...list].sort((a,b)=>b.price-a.price);
  else if(S.sort==='rating')list=[...list].sort((a,b)=>b.rating_avg-a.rating_avg);
  return list;
}
function buildGrid(){
  const list=filteredProducts();
  if(!S.products.length)return skeletonCards(8);
  if(!list.length)return `<div class="empty-box"><div class="empty-ico">🔍</div><div class="empty-ttl">No results${S.search?' for "'+esc(S.search)+'"':''}</div><div class="empty-sub">Try a different search or category.</div></div>`;
  return list.map(p=>productCardHTML(p)).join('');
}
function skeletonCards(n){return Array.from({length:n}).map(()=>`<div class="pcard"><div class="pcard-img skel"></div><div class="pcard-body"><div class="skel" style="height:14px;border-radius:6px;margin-bottom:8px"></div><div class="skel" style="height:14px;width:60%;border-radius:6px"></div></div></div>`).join('')}
function productCardHTML(p){
  const disc=discPct(p.compare_at_price,p.price);
  const wished=isWished(p.id);
  return `<div class="pcard" onclick="nav('product','${p.id}')">
    <div class="pcard-img">
      ${disc>0?`<div class="chip-corner">-${disc}%</div>`:''}
      ${p.bundle_qty?`<div class="chip-corner bundle">Bundle</div>`:''}
      <img src="${esc(coverImg(p))}" loading="lazy" alt="${esc(p.name)}" onerror="this.src='https://placehold.co/400x400/e7ebf3/98a2b8?text=No+Image'">
      <button class="wish-btn ${wished?'active':''}" data-pid="${p.id}" onclick="toggleWish('${p.id}',event)">${wished?'♥':'♡'}</button>
    </div>
    <div class="pcard-body">
      <div class="pcard-name">${esc(p.name)}</div>
      ${p.compare_at_price?`<div class="pcard-old">${fmt(p.compare_at_price)}</div>`:''}
      <div class="pcard-price">${fmt(p.price)}</div>
      <div class="pcard-foot"><span>${p.rating_count?`<span class="stars">★</span> ${p.rating_avg} (${p.rating_count})`:'New'}</span><span>+${calcEarnPts(p.price)} pts</span></div>
    </div>
  </div>`;
}
function pHome(){
  const st=S.settings;
  const offerBanner=S.offersOnly?`<div class="card" style="padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--accent),#d97e12);color:#241a02;border:none">
    <div style="font-size:1.6rem">🔥</div><div style="flex:1"><strong>Current offers</strong><div style="font-size:.8rem;opacity:.85">Bundle deals and discounted picks</div></div>
    <button class="btn btn-ghost btn-sm" style="background:rgba(255,255,255,.5);border-color:transparent" onclick="S.offersOnly=false;setCat('all')">Show all</button>
  </div>`:'';
  return `<div class="page">
    ${!S.offersOnly?`<div class="hero"><div class="hero-in">
      <h1>${esc(st.hero_title||'Everyday products, delivered fast.')}</h1>
      <p>${esc(st.hero_subtitle||'')}</p>
      <div class="hero-cta"><button class="btn btn-accent" onclick="nav('home',{offers:true})">See offers</button><button class="btn btn-ghost" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)" onclick="document.getElementById('search-field').focus()">Search products</button></div>
    </div></div>`:''}
    ${offerBanner}
    <div class="section-head"><div class="section-title">${S.offersOnly?'Offers':'Shop all products'}</div></div>
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input class="search-inp" id="search-field" placeholder="Search products…" value="${esc(S.search)}" oninput="doSearch(this.value)">
      <button class="search-clr ${S.search?'show':''}" id="search-clr" onclick="clearSearchInp()">✕</button>
    </div>
    <div class="cats-row" id="cats-row">${buildCatPills()}</div>
    <div class="sort-row">
      <span style="font-size:.8rem;color:var(--muted);font-weight:600">Sort:</span>
      <button class="sort-btn on" data-sort="def" onclick="setSort('def')">Default</button>
      <button class="sort-btn" data-sort="price_asc" onclick="setSort('price_asc')">Price ↑</button>
      <button class="sort-btn" data-sort="price_desc" onclick="setSort('price_desc')">Price ↓</button>
      <button class="sort-btn" data-sort="rating" onclick="setSort('rating')">Top rated</button>
      <span class="result-count" id="result-count">${filteredProducts().length} items</span>
    </div>
    <div class="grid" id="pgrid">${buildGrid()}</div>
  </div>`;
}
function bindHome(){}

/* =========================================================
   PRODUCT DETAIL
========================================================= */
let pdImages=[];let pdIdx=0;let pdReviews=[];
async function pProduct(){
  const p=S.products.find(x=>x.id===S.data);
  if(!p){nav('home');return}
  app().innerHTML=`<div class="page"><div class="spin spin-dark" style="margin:60px auto;display:block"></div></div>`;
  const[{data:imgs},{data:reviews}]=await Promise.all([
    sb.from('product_images').select('*').eq('product_id',p.id).order('sort_order'),
    sb.from('reviews').select('*, profiles(first_name,last_name)').eq('product_id',p.id).eq('status','approved').order('created_at',{ascending:false})
  ]);
  pdImages=(imgs&&imgs.length)?imgs.map(i=>i.url):[coverImg(p)];
  pdIdx=0;pdReviews=reviews||[];
  renderProductPage(p);
}
function renderProductPage(p){
  const disc=discPct(p.compare_at_price,p.price);
  const wished=isWished(p.id);
  const earn=calcEarnPts(S.buyMode==='bundle'&&p.bundle_qty?p.bundle_price:p.price*S.dqty);
  let bundleSec='';
  if(p.bundle_qty){
    const savings=fmt(p.price*p.bundle_qty-p.bundle_price);
    bundleSec=`<div class="bundle-opts">
      <div class="bopt ${S.buyMode==='normal'?'on':''}" onclick="selMode('normal')"><div style="font-weight:700;font-size:.85rem">Single item</div><div style="color:var(--primary);font-weight:800;margin-top:4px">${fmt(p.price)}</div></div>

function selMode(mode){
  S.buyMode=mode;const p=S.products.find(x=>x.id===S.data);
  document.querySelectorAll('.bopt').forEach((b,i)=>b.classList.toggle('on',(i===0&&mode==='normal')||(i===1&&mode==='bundle')));
  document.getElementById('qty-row').style.display=mode==='bundle'?'none':'flex';
  document.getElementById('pd-price').textContent=mode==='bundle'?fmt(p.bundle_price):fmt(p.price);
  document.getElementById('pd-lbp').textContent=`${fmtLBP(mode==='bundle'?p.bundle_price:p.price)} · Delivery ${fmt(p.delivery_price)}`;

function pdQty(d){const p=S.products.find(x=>x.id===S.data);S.dqty=Math.max(1,S.dqty+d);document.getElementById('pd-qty').value=S.dqty;const earn=calcEarnPts(p.price*S.dqty);document.getElementById('pts-chip').innerHTML=`★ Earn <strong>${earn}</strong> points with this order`}

function addToCart(pid){
  const p=S.products.find(x=>x.id===pid);if(!p)return;
  if(S.buyMode==='bundle'&&p.bundle_qty){
    const uid=p.id+'_bundle';
    const unitPrice=parseFloat((p.bundle_price/p.bundle_qty).toFixed(2));
    const ex=S.cart.find(i=>i._uid===uid);
    if(ex)ex.qty+=p.bundle_qty;else S.cart.push({_uid:uid,product_id:p.id,name:p.name,image:coverImg(p),price:unitPrice,qty:p.bundle_qty,delivery_price:p.delivery_price,is_bundle:true,bundle_label:`${p.bundle_qty}-pack`});
  }else{
    const uid=p.id+'_single';
    const ex=S.cart.find(i=>i._uid===uid);
    if(ex)ex.qty+=S.dqty;else S.cart.push({_uid:uid,product_id:p.id,name:p.name,image:coverImg(p),price:p.price,qty:S.dqty,delivery_price:p.delivery_price,is_bundle:false,bundle_label:''});

  saveCart();updateCartBadge();toast('Added to cart');
}

async function applyCoupon(){
  const code=document.getElementById('co-coupon').value.trim().toUpperCase();
  const msg=document.getElementById('coupon-msg');
  if(!code){msg.textContent='';return}
  const{data,error}=await sb.from('coupons').select('*').eq('code',code).eq('is_active',true).maybeSingle();
  if(error||!data){msg.textContent='Invalid or expired code';msg.style.color='var(--danger)';return}
  if(data.expires_at&&new Date(data.expires_at)<new Date()){msg.textContent='This coupon has expired';msg.style.color='var(--danger)';return}
  if(data.max_uses&&data.used_count>=data.max_uses){msg.textContent='This coupon has reached its usage limit';msg.style.color='var(--danger)';return}
  S.appliedDiscount=data.discount_type==='percent'?parseFloat((cartSub()*data.discount_value/100).toFixed(2)):data.discount_value;
  S.appliedCoupon=data;
  msg.textContent=`Applied! You save ${fmt(S.appliedDiscount)}`;msg.style.color='var(--success)';
  document.getElementById('place-order-btn').textContent=`Place order — ${fmt(cartTotal())}`;
}
async function placeOrder(){
  const fields=[['co-name','name'],['co-phone','phone'],['co-city','city'],['co-district','district'],['co-address','address']];
  const info={};let ok=true;
  fields.forEach(([id,key])=>{const el=document.getElementById(id);const v=el.value.trim();if(!v){el.classList.add('inv');ok=false}else{el.classList.remove('inv');info[key]=v}});
  if(!ok){toast('Please fill in all required fields');return}
  info.phone2=document.getElementById('co-phone2').value.trim();
  info.floor=document.getElementById('co-floor').value.trim();
  info.notes=document.getElementById('co-notes').value.trim();
  const btn=document.getElementById('place-order-btn');btn.disabled=true;btn.innerHTML='<div class="spin"></div> Placing order…';

  const orderNumber='DL-'+Date.now().toString().slice(-7);
  const earn=calcEarnPts(cartTotal());
  const orderRow={
    order_number:orderNumber,user_id:S.session?S.session.user.id:null,status:'confirmed',
    full_name:info.name,phone:info.phone,phone2:info.phone2,city:info.city,district:info.district,
    full_address:info.address,floor:info.floor,notes:info.notes,
    subtotal:cartSub(),delivery_fee:cartDelivery(),discount_amount:S.appliedDiscount||0,
    coupon_code:S.appliedCoupon?S.appliedCoupon.code:null,total:cartTotal(),points_earned:earn
  };
  const{data:order,error}=await sb.from('orders').insert(orderRow).select().single();
  if(error){btn.disabled=false;btn.textContent='Place order';toast('Could not place order — please try again');return}
  const items=S.cart.map(i=>({order_id:order.id,product_id:i.product_id,product_name:i.name,unit_price:i.price,quantity:i.qty,is_bundle:i.is_bundle,bundle_label:i.bundle_label}));
  await sb.from('order_items').insert(items);
  if(S.session){
    await sb.rpc('credit_points',{p_user:S.session.user.id,p_points:earn,p_note:'Order '+orderNumber});
    if(S.profile)S.profile.loyalty_points=(S.profile.loyalty_points||0)+earn;
  }
  if(S.appliedCoupon){
    await sb.from('coupons').update({used_count:S.appliedCoupon.used_count+1}).eq('id',S.appliedCoupon.id);
  }
  S.currentOrder={number:orderNumber,earn};
  S.cart=[];saveCart();updateCartBadge();S.appliedDiscount=0;S.appliedCoupon=null;
  nav('success',null,false);
}

    <div class="card" style="padding:20px;margin-bottom:16px">
      <div class="form-title">Delivery details</div>
      <div class="summary-row"><span>Name</span><span>${esc(o.full_name)}</span></div>
      <div class="summary-row"><span>Phone</span><span>${esc(o.phone)}</span></div>
      <div class="summary-row"><span>Address</span><span style="text-align:right">${esc(o.city)}, ${esc(o.district)} — ${esc(o.full_address)}</span></div>
    </div>
    ${canCancel?`<button class="btn btn-danger" onclick="cancelOrder('${o.id}','${esc(o.order_number)}','${o.created_at}')">Cancel order</button>`:''}
  </div>`;
}
async function cancelOrder(id,num,createdAt){
  const hoursSince=(Date.now()-new Date(createdAt).getTime())/3600000;
  const late=hoursSince>(S.settings.free_cancel_hours||24);
  const reason=prompt(late?`This order is past the free-cancellation window (${S.settings.free_cancel_hours}h). A $${S.settings.cancel_fee} fee may apply — our team will follow up. Add a reason (optional):`:'Add a cancellation reason (optional):')||'';
  if(reason===null)return;
  await sb.from('orders').update({status:'cancelled',cancel_reason:reason}).eq('id',id);
  const{data:o}=await sb.from('orders').select('points_earned,user_id').eq('id',id).maybeSingle();
  if(o&&o.user_id&&o.points_earned){
    await sb.rpc('credit_points',{p_user:o.user_id,p_points:-o.points_earned,p_note:'Order cancelled: '+num});
  }
  toast('Order cancelled');nav('orders',null,false);
}

/* =========================================================
   POINTS PAGE
========================================================= */
function tierFor(pts){if(pts>=3000)return{name:'Platinum',pct:8};if(pts>=1500)return{name:'Gold',pct:5};if(pts>=500)return{name:'Silver',pct:3};return{name:'Bronze',pct:0}}
async function pPoints(){
  if(!S.session){app().innerHTML=authRequiredHTML('view your points');return}
  app().innerHTML=`<div class="page"><div class="spin spin-dark" style="margin:60px auto;display:block"></div></div>`;
  const{data:hist}=await sb.from('points_history').select('*').eq('user_id',S.session.user.id).order('created_at',{ascending:false}).limit(20);
  const pts=S.profile?.loyalty_points||0;const tier=tierFor(pts);
  const next=pts>=3000?null:pts>=1500?3000:pts>=500?1500:500;
  const tiers=[{n:'Bronze',req:'0–499',pct:0},{n:'Silver',req:'500–1499',pct:3},{n:'Gold',req:'1500–2999',pct:5},{n:'Platinum',req:'3000+',pct:8}];
  app().innerHTML=`<div class="page">
    <button class="back-link" onclick="goBack()">← Back</button>
    <div class="pts-hero"><div style="font-size:.85rem;opacity:.8">Total points</div><div class="pts-hero-num">${pts}</div><div class="rank-badge">${tier.name}</div>${next?`<div style="font-size:.78rem;margin-top:10px;opacity:.85">${next-pts} pts to next tier</div>`:''}</div>
    <div class="tiers">${tiers.map(t=>`<div class="card tier ${t.n===tier.name?'on':''}"><div class="tier-name">${t.n}</div><div class="tier-req">${t.req} pts</div><div class="tier-pct">${t.pct>0?t.pct+'% off':'—'}</div></div>`).join('')}</div>
    <div class="card" style="padding:20px">
      <div class="form-title">Points history</div>
      ${(hist&&hist.length)?hist.map(h=>`<div class="summary-row"><span>${esc(h.note||'Activity')}<br><span style="font-size:.72rem;color:var(--muted)">${new Date(h.created_at).toLocaleDateString()}</span></span><span style="font-weight:800;color:${h.points>0?'var(--success)':'var(--danger)'}">${h.points>0?'+':''}${h.points}</span></div>`).join(''):`<div style="color:var(--muted);font-size:.85rem;padding:10px 0">No activity yet</div>`}
    </div>
  </div>`;
}

/* =========================================================
   ACCOUNT (auth + profile)
========================================================= */
let authTab='login';
function pAccount(){
  if(!S.session){app().innerHTML=pAuthForms();return}
  renderAccountLoggedIn();
}
function pAuthForms(){
  return `<div class="page" style="max-width:440px">
    <button class="back-link" onclick="goBack()">← Back</button>
    <div class="card form-card">
      <div class="auth-tabs">
        <button class="auth-tab ${authTab==='login'?'on':''}" onclick="setAuthTab('login')">Log in</button>
        <button class="auth-tab ${authTab==='register'?'on':''}" onclick="setAuthTab('register')">Register</button>
        <button class="auth-tab ${authTab==='forgot'?'on':''}" onclick="setAuthTab('forgot')">Forgot</button>
      </div>
      <div id="auth-msg"></div>
      <div id="auth-body"></div>
    </div>
  </div>`;
}
function setAuthTab(t){authTab=t;render();renderAuthBody()}
function renderAuthBody(){
  const body=document.getElementById('auth-body');if(!body)return;
  if(authTab==='login'){
    body.innerHTML=`
      <div class="fgroup"><label class="flabel">Email <span class="req">*</span></label><input class="finput" id="lg-email" type="email"></div>
      <div class="fgroup"><label class="flabel">Password <span class="req">*</span></label><input class="finput" id="lg-pass" type="password"></div>
      <button class="btn btn-primary" id="lg-btn" onclick="doLogin()">Log in</button>`;
  }else if(authTab==='register'){
    body.innerHTML=`
      <div class="frow2">
        <div class="fgroup"><label class="flabel">First name <span class="req">*</span></label><input class="finput" id="rg-fname"></div>
        <div class="fgroup"><label class="flabel">Last name <span class="req">*</span></label><input class="finput" id="rg-lname"></div>
      </div>
      <div class="fgroup"><label class="flabel">Username <span class="req">*</span></label><input class="finput" id="rg-username"></div>
      <div class="fgroup"><label class="flabel">Email <span class="req">*</span></label><input class="finput" id="rg-email" type="email"></div>
      <div class="fgroup"><label class="flabel">Phone number <span class="req">*</span></label><input class="finput" id="rg-phone" type="tel"></div>
      <div class="fgroup"><label class="flabel">Password <span class="req">*</span></label><input class="finput" id="rg-pass" type="password"></div>
      <button class="btn btn-primary" id="rg-btn" onclick="doRegister()">Create account</button>`;
  }else{
    body.innerHTML=`
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:14px">Enter your email and we'll send you a reset link.</p>
      <div class="fgroup"><label class="flabel">Email <span class="req">*</span></label><input class="finput" id="fg-email" type="email"></div>
      <button class="btn btn-primary" id="fg-btn" onclick="doForgot()">Send reset link</button>`;
  }
}
function authMsg(text,ok){const el=document.getElementById('auth-msg');if(!el)return;el.innerHTML=text?`<div class="alert ${ok?'alert-ok':'alert-err'}">${esc(text)}</div>`:''}
async function doLogin(){
  const email=document.getElementById('lg-email').value.trim();const pass=document.getElementById('lg-pass').value;
  if(!email||!pass){authMsg('Please fill in all fields',false);return}
  const btn=document.getElementById('lg-btn');btn.disabled=true;btn.innerHTML='<div class="spin"></div>';
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;btn.textContent='Log in';
  if(error){authMsg(error.message,false);return}
  await loadProfileAndWishlist();toast('Welcome back!');nav('account',null,false);
}
async function doRegister(){
  const fname=document.getElementById('rg-fname').value.trim();
  const lname=document.getElementById('rg-lname').value.trim();
  const username=document.getElementById('rg-username').value.trim();
  const email=document.getElementById('rg-email').value.trim();
  const phone=document.getElementById('rg-phone').value.trim();
  const pass=document.getElementById('rg-pass').value;
  if(!fname||!lname||!username||!email||!phone||!pass){authMsg('Please fill in all fields',false);return}
  if(pass.length<6){authMsg('Password must be at least 6 characters',false);return}
  const btn=document.getElementById('rg-btn');btn.disabled=true;btn.innerHTML='<div class="spin"></div>';
  const{error}=await sb.auth.signUp({email,password:pass,options:{data:{first_name:fname,last_name:lname,username,phone}}});
  btn.disabled=false;btn.textContent='Create account';
  if(error){authMsg(error.message,false);return}
  authMsg('Account created! Check your email to confirm, then log in.',true);
  setAuthTab('login');
}
async function doForgot(){
  const email=document.getElementById('fg-email').value.trim();
  if(!email){authMsg('Please enter your email',false);return}
  const btn=document.getElementById('fg-btn');btn.disabled=true;btn.innerHTML='<div class="spin"></div>';
  const{error}=await sb.auth.resetPasswordForEmail(email);
  btn.disabled=false;btn.textContent='Send reset link';
  if(error){authMsg(error.message,false);return}
  authMsg('If that email is registered, a reset link is on its way.',true);
}
function renderAccountLoggedIn(){
  const p=S.profile||{};
  app().innerHTML=`<div class="page" style="max-width:520px">
    <button class="back-link" onclick="goBack()">← Back</button>
    <div class="profile-hero">
      <div class="avatar-circ">${esc((p.first_name||'U')[0])}</div>
      <div><div style="font-weight:800">${esc(p.first_name||'')} ${esc(p.last_name||'')}</div><div style="color:var(--muted);font-size:.85rem">@${esc(p.username||'')}</div></div>
    </div>
    <div class="card" style="padding:8px">
      <div class="menu-list">
        <div class="menu-item" onclick="nav('orders')">📦 My Orders <span>›</span></div>
        <div class="menu-item" onclick="nav('wishlist')">♡ Wishlist <span>›</span></div>
        <div class="menu-item" onclick="nav('points')">★ My Points (${p.loyalty_points||0}) <span>›</span></div>
        <div class="menu-item" onclick="openEditProfile()">✎ Edit profile <span>›</span></div>
      </div>
    </div>
    <button class="btn btn-danger" style="margin-top:16px" onclick="doLogout()">Log out</button>
  </div>`;
}
function openEditProfile(){
  const p=S.profile||{};
  document.getElementById('modal-root').innerHTML=`<div class="modal-ov" onclick="closeModal(event)"><div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div><div class="modal-title">Edit profile</div>
    <div class="frow2">
      <div class="fgroup"><label class="flabel">First name</label><input class="finput" id="ep-fname" value="${esc(p.first_name||'')}"></div>
      <div class="fgroup"><label class="flabel">Last name</label><input class="finput" id="ep-lname" value="${esc(p.last_name||'')}"></div>
    </div>
    <div class="fgroup"><label class="flabel">Phone</label><input class="finput" id="ep-phone" value="${esc(p.phone||'')}"></div>
    <button class="btn btn-primary" onclick="saveProfile()">Save changes</button>
  </div></div>`;
}
async function saveProfile(){
  const fname=document.getElementById('ep-fname').value.trim();
  const lname=document.getElementById('ep-lname').value.trim();
  const phone=document.getElementById('ep-phone').value.trim();
  const{error}=await sb.from('profiles').update({first_name:fname,last_name:lname,phone}).eq('id',S.session.user.id);
  if(error){toast('Could not save changes');return}
  S.profile={...S.profile,first_name:fname,last_name:lname,phone};
  closeModal();toast('Profile updated');renderAccountLoggedIn();
}
async function doLogout(){await sb.auth.signOut();S.profile=null;S.wishlist=[];toast('Logged out');nav('home',null,false)}

/* =========================================================
   CONTACT
========================================================= */
function pContact(){
  const st=S.settings;
  return `<div class="page" style="max-width:560px">
    <button class="back-link" onclick="goBack()">← Back</button>
    <div class="hero" style="padding:34px 26px"><div class="hero-in"><h1 style="font-size:1.5rem">Contact us</h1><p>We're here to help with anything you need.</p></div></div>
    <div class="card form-card">
      <div id="ct-msg"></div>
      <div class="fgroup"><label class="flabel">Name <span class="req">*</span></label><input class="finput" id="ct-name"></div>
      <div class="fgroup"><label class="flabel">Phone <span class="req">*</span></label><input class="finput" id="ct-phone"></div>
      <div class="fgroup"><label class="flabel">Message <span class="req">*</span></label><textarea class="ftextarea" id="ct-msg-txt"></textarea></div>
      <button class="btn btn-primary" id="ct-btn" onclick="sendContact()">Send message</button>
    </div>
    <div class="card" style="padding:20px;text-align:center">
      <div class="footer-h">Follow us</div>
      <div class="soc-row" style="justify-content:center">
        ${st.instagram_url?`<a href="${esc(st.instagram_url)}" target="_blank">IG</a>`:''}
        ${st.facebook_url?`<a href="${esc(st.facebook_url)}" target="_blank">FB</a>`:''}
        ${st.tiktok_url?`<a href="${esc(st.tiktok_url)}" target="_blank">TT</a>`:''}
        <a href="https://wa.me/${(st.whatsapp_number||'').replace(/\D/g,'')}" target="_blank">WA</a>
      </div>
    </div>
  </div>`;
}
async function sendContact(){
  const name=document.getElementById('ct-name').value.trim();
  const phone=document.getElementById('ct-phone').value.trim();
  const msg=document.getElementById('ct-msg-txt').value.trim();
  if(!name||!phone||!msg){toast('Please fill in all fields');return}
  const btn=document.getElementById('ct-btn');btn.disabled=true;btn.innerHTML='<div class="spin"></div>';
  const{error}=await sb.from('contact_messages').insert({name,phone,message:msg});
  btn.disabled=false;btn.textContent='Send message';
  if(error){document.getElementById('ct-msg').innerHTML='<div class="alert alert-err">Could not send — please try again.</div>';return}
  document.getElementById('ct-msg').innerHTML=`<div class="alert alert-ok">Message sent — we'll get back to you soon.</div>`;
  document.getElementById('ct-name').value='';document.getElementById('ct-phone').value='';document.getElementById('ct-msg-txt').value='';
}

/* =========================================================
   PATCH render() to call renderAuthBody after auth page renders
========================================================= */
const _origRender=render;
render=function(){_origRender();if(S.page==='account'&&!S.session)renderAuthBody()};

boot();
</script>
